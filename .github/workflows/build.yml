name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Scheduler self-test
        run: node tools/test-plan.cjs
      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk husoon-alhifz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: husoon-alhifz-apk
          path: husoon-alhifz.apk
          if-no-files-found: error
